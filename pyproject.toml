[project]
name = "python-stdx"
version = "0.1.0"
description = "Reusable Python infrastructure with explicit capability boundaries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
cache = [
    "cachetools>=5.5,<7.0",
]
redis = [
    "redis>=5.0,<9.0",
]
scheduler = [
    "croniter>=2.0,<7.0",
    "opentelemetry-api>=1.20,<2.0",
]
database = [
    "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "cachetools>=5.5,<7.0",
    "croniter>=2.0,<7.0",
    "mypy>=1.11",
    "opentelemetry-api>=1.20,<2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "redis>=5.0,<9.0",
    "ruff>=0.6",
    "sqlalchemy>=2.0,<3.0",
    "types-cachetools>=5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_stdx"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
